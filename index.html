<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo claro" aria-pressed="false" title="Cambiar tema">🌙</button>
    <div class="game-container">
      <aside id="challenge-panel" class="panel challenge-panel" hidden>
        <div class="panel-section">
          <span class="label" id="ch-index">DESAFÍO</span>
          <span class="ch-name" id="ch-name"></span>
          <span class="ch-text" id="ch-desc"></span>
        </div>
        <div class="panel-section">
          <span class="label">OBJETIVO</span>
          <span class="ch-text" id="ch-goal"></span>
        </div>
        <div class="panel-section">
          <span class="label">PROGRESO</span>
          <span class="ch-value" id="ch-progress"></span>
          <span class="ch-value" id="ch-time"></span>
          <span class="ch-value" id="ch-garbage"></span>
        </div>
        <div class="panel-section">
          <span class="label">MODIFICADORES</span>
          <span class="ch-text" id="ch-mods"></span>
        </div>
        <div class="panel-section">
          <span class="label">ESTADO</span>
          <span class="ch-status" id="ch-status"></span>
        </div>
      </aside>

      <div id="board-wrap" class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
      </div>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <label class="label" for="mode-select">MODO</label>
          <select id="mode-select"></select>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
            <li><kbd>Z</kbd> rotar ↺</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="next-btn" type="button" hidden>Siguiente desafío</button>
        <button id="restart-btn">Reiniciar</button>
        <button id="exit-btn" class="secondary" type="button" hidden>Salir del desafío</button>
      </div>
    </div>
  </div>

  <script src="scoreManager.js"></script>
  <script src="challenges.js"></script>
  <script src="challengeManager.js"></script>
  <script src="soundEffects.js"></script>
  <script src="visualEffects.js"></script>
  <script src="game.js"></script>
</body>
</html>
